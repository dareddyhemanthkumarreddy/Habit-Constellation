services:
  - type: web
    name: habit-constellation
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma migrate deploy && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habit-constellation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: habit-constellation-db
    plan: free
    databaseName: habit_constellation
    user: postgres
